name: Push - Build, Promote & Deploy

on:
    push:
        branches: [dev, staging, prod]

env:
    REGISTRY: ghcr.io

permissions:
    contents: read
    packages: write
    security-events: write

jobs:
    build-scan-push:
        name: Build & Scan (Dev only)
        runs-on: ubuntu-latest
        if: github.ref == 'refs/heads/dev'
        steps:
            - uses: actions/checkout@v6

            - name: Set lowercase image name
              run: echo "IMAGE_NAME=$(echo '${{ github.repository }}' | tr '[:upper:]' '[:lower:]')" >> "$GITHUB_ENV"

            - name: Log in to GHCR
              uses: docker/login-action@v3
              with:
                  registry: ghcr.io
                  username: ${{ github.actor }}
                  password: ${{ secrets.GITHUB_TOKEN }}

            - name: Build image
              run: |
                  docker build -t ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:dev-${{ github.sha }} .

            - name: Scan (Trivy)
              uses: aquasecurity/trivy-action@v0.36.0
              with:
                  image-ref: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:dev-${{ github.sha }}
                  scan-type: image
                  exit-code: 1

            - name: Push images
              run: |
                  docker push ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:dev-${{ github.sha }}
                  docker tag ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:dev-${{ github.sha }} \
                             ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:dev-latest
                  docker push ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:dev-latest

    promote-staging:
        name: Promote to Staging
        runs-on: ubuntu-latest
        if: github.ref == 'refs/heads/staging'
        steps:
            - uses: actions/checkout@v6
            - name: Set lowercase image name
              run: echo "IMAGE_NAME=$(echo '${{ github.repository }}' | tr '[:upper:]' '[:lower:]')" >> "$GITHUB_ENV"

            - name: Log in to GHCR
              uses: docker/login-action@v3
              with:
                  registry: ghcr.io
                  username: ${{ github.actor }}
                  password: ${{ secrets.GITHUB_TOKEN }}

            - name: Install regctl
              run: |
                  curl -L https://github.com/regclient/regclient/releases/latest/download/regctl-linux-amd64 > regctl
                  chmod +x regctl
                  sudo mv regctl /usr/local/bin/regctl

            - name: Log in to GHCR (regctl)
              run: regctl registry login ${{ env.REGISTRY }} -u ${{ github.actor }} -p ${{ secrets.GITHUB_TOKEN }}

            - name: Promote to staging
              run: |
                  regctl image copy ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:dev-${{ github.sha }} \
                                    ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:staging-${{ github.sha }}
                  regctl image copy ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:dev-${{ github.sha }} \
                                    ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:staging-latest

    promote-prod:
        name: Promote to Prod
        runs-on: ubuntu-latest
        if: github.ref == 'refs/heads/prod'
        permissions:
            contents: write
            packages: write
        steps:
            - uses: actions/checkout@v6
            - name: Set lowercase image name
              run: echo "IMAGE_NAME=$(echo '${{ github.repository }}' | tr '[:upper:]' '[:lower:]')" >> "$GITHUB_ENV"
            - name: Log in to GHCR
              uses: docker/login-action@v3
              with:
                  registry: ghcr.io
                  username: ${{ github.actor }}
                  password: ${{ secrets.GITHUB_TOKEN }}

            - name: Install regctl
              run: |
                  curl -L https://github.com/regclient/regclient/releases/latest/download/regctl-linux-amd64 > regctl
                  chmod +x regctl
                  sudo mv regctl /usr/local/bin/regctl

            - name: Log in to GHCR (regctl)
              run: regctl registry login ${{ env.REGISTRY }} -u ${{ github.actor }} -p ${{ secrets.GITHUB_TOKEN }}

            - name: Promote to prod
              run: |
                  regctl image copy ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:staging-${{ github.sha }} \
                                    ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:prod-${{ github.sha }}
                  regctl image copy ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:staging-${{ github.sha }} \
                                    ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:prod-latest

            - name: Create git tag
              run: |
                  git tag prod-${{ github.sha }}
                  git push origin prod-${{ github.sha }}
