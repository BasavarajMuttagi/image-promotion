name: CI Pipeline with Security Scans

on:
    pull_request:
        branches:
            - dev
            - staging
            - main

permissions:
    contents: read
    security-events: write
    pull-requests: write

jobs:
    secret-scan:
        name: Secret Scan — Gitleaks
        runs-on: ubuntu-latest
        steps:
            - name: Checkout full Git history
              uses: actions/checkout@v5
              with:
                  fetch-depth: 0

            - name: Scan for exposed secrets
              uses: gitleaks/gitleaks-action@v2
              env:
                  GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

    tests:
        name: Tests
        runs-on: ubuntu-latest
        steps:
            - name: Checkout code
              uses: actions/checkout@v5

            - name: Set up Node.js
              uses: actions/setup-node@v5
              with:
                  node-version: "24"
                  cache: npm

            - name: Install dependencies
              run: npm ci

            - name: Run linter
              run: npm run lint

            - name: Check code format
              run: npm run format:check

            - name: Run unit tests
              run: npm test

    source-security-scan:
        name: Source Security Scan — Trivy
        runs-on: ubuntu-latest
        steps:
            - name: Checkout code
              uses: actions/checkout@v5

            - name: Scan filesystem for vulnerabilities
              id: trivy-source-scan
              uses: aquasecurity/trivy-action@v0.35.0
              with:
                  scan-type: fs
                  scan-ref: .
                  format: sarif
                  output: trivy-source-results.sarif
                  severity: CRITICAL,HIGH
                  limit-severities-for-sarif: true
                  exit-code: 1
                  ignore-unfixed: true
                  skip-dirs: .git,.github,node_modules,dist,coverage

            - name: Upload source scan report
              if: always()
              uses: github/codeql-action/upload-sarif@v4
              with:
                  sarif_file: trivy-source-results.sarif
                  category: trivy-source

    build:
        name: Build
        runs-on: ubuntu-latest
        needs:
            - secret-scan
            - tests
            - source-security-scan
        if: success()
        steps:
            - name: Checkout code
              uses: actions/checkout@v5

            - name: Set up Node.js
              uses: actions/setup-node@v5
              with:
                  node-version: "24"
                  cache: npm

            - name: Install dependencies
              run: npm ci

            - name: Build application
              run: npm run build
